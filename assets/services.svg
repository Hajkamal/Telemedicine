<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" role="img" aria-labelledby="svcTitle svcDesc">
  <title id="svcTitle">Basina services — appointments, online consultations, AI lab interpretation, AI triage, electronic health records, doctor panel</title>
  <desc id="svcDesc">Six service cards describing Basina's digital health platform: in-person appointment booking, online doctor consultations, AI-assisted lab test interpretation, AI symptom triage, consent-based electronic health records, and a doctor and clinic panel.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050914"/>
      <stop offset="0.6" stop-color="#070e20"/>
      <stop offset="1" stop-color="#0a1430"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3D61FF" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#3D61FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3D61FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7aa2ff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3D61FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="tileGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#8fb0ff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <style>
      .icon { animation: iconBreathe 5.5s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      .d1 { animation-delay: 0s; } .d2 { animation-delay: 0.45s; } .d3 { animation-delay: 0.9s; }
      .d4 { animation-delay: 1.35s; } .d5 { animation-delay: 1.8s; } .d6 { animation-delay: 2.25s; }
      .star { animation: twinkle 3.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes iconBreathe { 0%, 100% { transform: scale(1); opacity: 0.92; } 50% { transform: scale(1.07); opacity: 1; } }
      @keyframes twinkle { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .icon, .star { animation: none; } }
    </style>
  </defs>

  <rect width="1400" height="860" fill="url(#bg)"/>
  <rect width="1400" height="860" fill="url(#grid)"/>
  <circle cx="1180" cy="60" r="420" fill="url(#glow)"/>
  <circle cx="160" cy="780" r="380" fill="url(#glow2)"/>

  <!-- header -->
  <text x="82" y="72" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6ea0ff">WHAT WE DO</text>
  <text x="80" y="126" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="45" font-weight="800" letter-spacing="-1.2" fill="#f4f7ff">One platform for the whole care journey.</text>
  <text x="82" y="168" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#ffd08a" direction="rtl" text-anchor="end">همه مسیر سلامت، در یک پلتفرم</text>

  <g>
    <rect x="1140" y="54" width="178" height="42" rx="21" fill="#0d1734" stroke="#2b3f7a"/>
    <circle cx="1164" cy="75" r="4" fill="#34d399"/>
    <text x="1178" y="80" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4" fill="#a9e9cf">LIVE IN IRAN</text>
  </g>

  <!-- ============ CARD 1 ============ -->
  <g>
    <rect x="82" y="228" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M106 228H454" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="106" y="252" width="56" height="56" rx="16" fill="#3D61FF" fill-opacity="0.14" stroke="#3D61FF" stroke-opacity="0.35"/>
    <g transform="translate(120 266)">
      <g fill="none" stroke="#8fb4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d1">
        <rect x="3.5" y="5.5" width="21" height="18" rx="4"/>
        <path d="M3.5 11.5h21M9.5 2.5v6M18.5 2.5v6"/>
        <path d="M10 18l3 3 5.5-5.5"/>
      </g>
    </g>
    <text x="106" y="344" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">Appointment booking</text>
    <text x="106" y="368" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">نوبت‌دهی اینترنتی</text>
    <text x="106" y="396" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Find the right doctor by specialty and city, then</text>
    <text x="106" y="416" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">reserve an in-person visit in minutes.</text>
    <rect x="106" y="440" width="190" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="120" y="460" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">900+ doctors · 56 cities</text>
  </g>

  <!-- ============ CARD 2 ============ -->
  <g>
    <rect x="502" y="228" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M526 228H874" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="526" y="252" width="56" height="56" rx="16" fill="#0d9488" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <g transform="translate(540 266)">
      <g fill="none" stroke="#7fe7d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d2">
        <rect x="2.5" y="6.5" width="16.5" height="15" rx="4"/>
        <path d="M19 11.5l6-3.5v12l-6-3.5"/>
        <path d="M8 12.5l3 2l-3 2z" fill="#7fe7d6" stroke="none"/>
      </g>
    </g>
    <text x="526" y="344" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">Online consultation</text>
    <text x="526" y="368" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">مشاوره آنلاین پزشک</text>
    <text x="526" y="396" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Text or video visits with licensed specialists,</text>
    <text x="526" y="416" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">without leaving home.</text>
    <rect x="526" y="440" width="282" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="540" y="460" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">260+ online doctors · 107 specialties</text>
  </g>

  <!-- ============ CARD 3 ============ -->
  <g>
    <rect x="922" y="228" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M946 228H1294" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="946" y="252" width="56" height="56" rx="16" fill="#7c3aed" fill-opacity="0.16" stroke="#a78bfa" stroke-opacity="0.35"/>
    <g transform="translate(960 266)">
      <g fill="none" stroke="#c4b5fd" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d3">
        <path d="M10.5 3.5h7M14 3.5v7L21 21a2.6 2.6 0 0 1-2.3 3.9H9.3A2.6 2.6 0 0 1 7 21l7-10.5v-7"/>
        <path d="M9.5 17.5h9"/>
        <path d="M22 3.5l.9 2.4 2.4.9-2.4.9-.9 2.4-.9-2.4-2.4-.9 2.4-.9z"/>
      </g>
    </g>
    <text x="946" y="344" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">AI lab interpretation</text>
    <text x="946" y="368" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">تفسیر آزمایش با هوش مصنوعی</text>
    <text x="946" y="396" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Upload a photo or PDF and get a clear,</text>
    <text x="946" y="416" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">patient-friendly explanation.</text>
    <rect x="946" y="440" width="232" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="960" y="460" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">Blood, urine, imaging &amp; more</text>
  </g>

  <!-- ============ CARD 4 ============ -->
  <g>
    <rect x="82" y="512" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M106 512H454" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="106" y="536" width="56" height="56" rx="16" fill="#f5a524" fill-opacity="0.14" stroke="#f5a524" stroke-opacity="0.38"/>
    <g transform="translate(120 550)">
      <g fill="none" stroke="#ffd08a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d4">
        <path d="M14 24.5S3.5 18.2 3.5 10.6A5.9 5.9 0 0 1 14 6.9a5.9 5.9 0 0 1 10.5 3.7c0 7.6-10.5 13.9-10.5 13.9z"/>
        <path d="M6 14h5l2-4 3 8 2-4h4"/>
      </g>
    </g>
    <text x="106" y="628" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">AI symptom triage</text>
    <text x="106" y="652" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">تریاژ هوشمند علائم</text>
    <text x="106" y="680" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Describe how you feel and get structured</text>
    <text x="106" y="700" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">guidance on the next step.</text>
    <rect x="106" y="724" width="272" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="120" y="744" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">Preliminary guidance · not a diagnosis</text>
  </g>

  <!-- ============ CARD 5 ============ -->
  <g>
    <rect x="502" y="512" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M526 512H874" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="526" y="536" width="56" height="56" rx="16" fill="#3D61FF" fill-opacity="0.14" stroke="#3D61FF" stroke-opacity="0.35"/>
    <g transform="translate(540 550)">
      <g fill="none" stroke="#8fb4ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d5">
        <path d="M3.5 8.5a3 3 0 0 1 3-3h5l3 3h6a3 3 0 0 1 3 3v9.5a3 3 0 0 1-3 3h-14a3 3 0 0 1-3-3z"/>
        <path d="M14 20.5s-4.5-2.6-4.5-5.2a2.6 2.6 0 0 1 4.5-1.7 2.6 2.6 0 0 1 4.5 1.7c0 2.6-4.5 5.2-4.5 5.2z"/>
      </g>
    </g>
    <text x="526" y="628" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">Electronic health record</text>
    <text x="526" y="652" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">پرونده الکترونیک سلامت</text>
    <text x="526" y="680" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Results, visits, and trends in one consent-based</text>
    <text x="526" y="700" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">record for the whole family.</text>
    <rect x="526" y="724" width="222" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="540" y="744" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">Consent-first · family profiles</text>
  </g>

  <!-- ============ CARD 6 ============ -->
  <g>
    <rect x="922" y="512" width="396" height="260" rx="22" fill="#0b1530" stroke="#263a70"/>
    <path d="M946 512H1294" stroke="url(#hair)" stroke-width="1.4"/>
    <rect x="946" y="536" width="56" height="56" rx="16" fill="#0d9488" fill-opacity="0.16" stroke="#2dd4bf" stroke-opacity="0.35"/>
    <g transform="translate(960 550)">
      <g fill="none" stroke="#7fe7d6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="icon d6">
        <rect x="2.5" y="4.5" width="23" height="16" rx="3"/>
        <path d="M9 25h10M14 20.5V25"/>
        <path d="M6 13h4l2-3.5 3 7 2-3.5h5"/>
      </g>
    </g>
    <text x="946" y="628" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="21" font-weight="700" fill="#f4f7ff">Doctor &amp; clinic panel</text>
    <text x="946" y="652" font-family="Tahoma, 'Segoe UI', sans-serif" font-size="14" fill="#8fa3c8" direction="rtl" text-anchor="end">پنل پزشکان و کلینیک‌ها</text>
    <text x="946" y="680" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">Manage appointments, consultations, and</text>
    <text x="946" y="700" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13.5" fill="#93a4c8">patient history beyond your city.</text>
    <rect x="946" y="724" width="150" height="30" rx="15" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.10"/>
    <text x="960" y="744" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#a9bde8">panel.basina.app</text>
  </g>

  <text x="700" y="822" text-anchor="middle" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="13" fill="#7f93bd">Every service connects to the same consent-based record — care never starts from zero.</text>
</svg>
